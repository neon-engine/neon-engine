# A crate that is spawned while the game runs, with no behaviour: a body alone. Half a metre,
# in one plain colour, so that nothing is read from an image.
version: 1
prefab: crate-none

entity:
  components:
    Transform:
      scale: 0.5
    Geometry: Default
    Renderable:
      shader: engine://shaders/basic-lit
      material:
        shininess: 16
        color: [0.75, 0.55, 0.3]
    RigidBody: Default
    Collider:
      shape: box
    Crate: Default
