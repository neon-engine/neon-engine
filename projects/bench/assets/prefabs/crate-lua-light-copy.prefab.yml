# A crate that is spawned while the game runs, with the behavior in Lua that does the least. Half a meter,
# in one plain color, so that nothing is read from an image.
version: 1
prefab: crate-lua-light-copy

entity:
  components:
    Transform:
      scale: 0.5
    Geometry: Default
    Renderable:
      shader: engine://shaders/basic-lit
      material:
        shininess: 16
        color: [0.75, 0.55, 0.3]
    RigidBody: Default
    Collider:
      shape: box
    LightCopy: Default
