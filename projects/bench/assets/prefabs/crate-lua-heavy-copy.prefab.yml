# A crate that is spawned while the game runs, with the behaviour in Lua that copies its position. Half a metre,
# in one plain colour, so that nothing is read from an image.
version: 1
prefab: crate-lua-heavy-copy

entity:
  components:
    Transform:
      scale: 0.5
    Geometry: Default
    Renderable:
      shader: engine://shaders/basic-lit
      material:
        shininess: 16
        color: [0.75, 0.55, 0.3]
    RigidBody: Default
    Collider:
      shape: box
    HeavyCopy: Default
