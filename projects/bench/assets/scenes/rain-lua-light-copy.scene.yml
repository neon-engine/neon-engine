# Crates dropped for ever onto a lit floor, sixty a second, each with the
# least a script can do, in Lua: LightCopy.
scene: rain-lua-light-copy
version: 1

entities:
  - name: camera
    components:
      Transform:
        position: [0, 14, 34]
        rotation: [-18, 0, 0]
      Camera: Default

  - name: sun
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.3, -1, -0.2]
        ambient: [0.35, 0.35, 0.4]
        diffuse: [0.6, 0.6, 0.55]
        specular: [0.2, 0.2, 0.2]

  - name: floor
    components:
      Transform:
        position: [0, -0.5, 0]
        scale: [120, 1, 120]
      Geometry: Default
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 8
          color: [0.82, 0.82, 0.85]
      RigidBody:
        kind: static
      Collider:
        shape: box

  - name: hud
    components:
      Ui:
        file: assets://ui/counter.ui.yml

  - name: spawner
    components:
      NativeSpawner:
        behaviour: 4
        per_second: 60
