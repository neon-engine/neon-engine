# The sign of hall 03, shown on a surface of its own by demo.scene.yml.

ui: sign-lights
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #ff5d5d"
  children:
    - type: label
      text: "03"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#ff5d5d"
    - type: label
      text: "Lights"
      font_size: 92
      font_weight: bold
    - type: label
      text: "Step into the dark room: three point lights"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "in red, green, and blue that mix to white,"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "a spot light, and a cube that glows."
      font_size: 36
      color: "#ffffffc8"
