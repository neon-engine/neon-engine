# The sign of hall 04, shown on a surface of its own by demo.scene.yml.

ui: sign-glass
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #7be0c3"
  children:
    - type: label
      text: "04"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#7be0c3"
    - type: label
      text: "Transparency"
      font_size: 92
      font_weight: bold
    - type: label
      text: "Panes with alpha_mode: blend, drawn from the"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "farthest to the nearest. Walk round the two"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "cards: one has a back, one has none."
      font_size: 36
      color: "#ffffffc8"
