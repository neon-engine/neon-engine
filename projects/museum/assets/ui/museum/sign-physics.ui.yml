# The sign of hall 06, shown on a surface of its own by demo.scene.yml.

ui: sign-physics
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #ffd24a"
  children:
    - type: label
      text: "06"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#ffd24a"
    - type: label
      text: "Physics"
      font_size: 92
      font_weight: bold
    - type: label
      text: "Static, dynamic, and kinematic bodies, with"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "a collider of every shape. Walk into the"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "crates. The paddle is moved by nothing."
      font_size: 36
      color: "#ffffffc8"
