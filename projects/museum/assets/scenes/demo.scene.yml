  # --------------------------------------------------------------------------
  # 01 Shapes
  # What a Geometry builds, each on a pedestal, see docs/geometry.md. The
  # pedestals are one prefab. The mats of the halls are the plane, and the
  # tube is a pipe on the west wall.
  # --------------------------------------------------------------------------

  - name: shapes-box-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -7]

  - name: shapes-box
    components:
      Transform:
        position: [-5.5, 1.35, -7]
      Geometry:
        shape: box
        size: [0.7, 0.7, 0.7]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.64, 0.23]
          roughness: 0.7

  - name: shapes-ramp-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -5.5]

  # a ramp stands on its origin, and rises towards its back
  - name: shapes-ramp
    components:
      Transform:
        position: [-5.5, 1, -5.5]
        rotation: [0, 90, 0]
      Geometry:
        shape: ramp
        size: [0.7, 0.5, 0.7]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.64, 0.23]
          roughness: 0.7

  - name: shapes-prism-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -4]

  # a prism is an outline on the ground pulled up: here a hexagon
  - name: shapes-prism
    components:
      Transform:
        position: [-5.5, 1, -4]
      Geometry:
        shape: prism
        size: [0, 0.7, 0]
        outline: [0.4, 0, 0.2, 0.3464, -0.2, 0.3464, -0.4, 0, -0.2, -0.3464, 0.2, -0.3464]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.64, 0.23]
          roughness: 0.7

  - name: shapes-cylinder-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -2.5]

  # eight sides, each a flat face
  - name: shapes-cylinder
    components:
      Transform:
        position: [-5.5, 1.4, -2.5]
      Geometry:
        shape: cylinder
        size: [0.6, 0.8, 0.6]
        sides: 8
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.64, 0.23]
          roughness: 0.7

  - name: shapes-column-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -1]

  # smooth rounds the side and keeps the caps flat
  - name: shapes-column
    components:
      Transform:
        position: [-5.5, 1.4, -1]
      Geometry:
        shape: cylinder
        size: [0.6, 0.8, 0.6]
        sides: 32
