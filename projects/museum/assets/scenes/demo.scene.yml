    components:
      Transform:
        position: [0, 3.4, -0.6]
        scale: 1.5
    children:
      - name: board
        components:
          Renderable:
            textures:
              - surface://sign-title
          UiSurface:
            ui: assets://ui/museum/sign-title.ui.yml
            name: sign-title
            size: [1024, 512]
            reach: 0.01

