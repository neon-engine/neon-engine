  # two crates held as one by a fixed joint, with a bar between them that
  # goes with the one it is below: push one, and both go
  - name: joints-fixed-a
    components:
      Transform:
        position: [-5.2, 0.25, -25.2]
      Geometry:
        shape: box
        size: [0.5, 0.5, 0.5]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.3, 0.6, 0.9]
          roughness: 0.6
      RigidBody: Default
      Collider:
        shape: box
        size: [0.5, 0.5, 0.5]

  - name: joints-fixed-b
    components:
      Transform:
        position: [-5.2, 0.25, -26.1]
      Geometry:
        shape: box
        size: [0.5, 0.5, 0.5]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.9, 0.6, 0.3]
          roughness: 0.6
      RigidBody: Default
      Collider:
        shape: box
        size: [0.5, 0.5, 0.5]
      Joint:
        type: fixed
        other: joints-fixed-a
        anchor: [0, 0, 0.45]
    children:
      - name: bar
        components:
          Transform:
            position: [0, 0, 0.45]
          Geometry:
            shape: box
            size: [0.08, 0.08, 0.4]
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [0.12, 0.13, 0.15]
              roughness: 0.6

  # --------------------------------------------------------------------------
  # 08 Character
  # What a CharacterBody does with the ground. Steps of 0.2 are below the
  # step_height of 0.25 and are walked up; the green ramp is 27 degrees, the
  # red one 63, which is above max_slope and so a wall.
  # --------------------------------------------------------------------------

  - name: character-step-1
    components:
      Transform:
        position: [7.2, 0.1, -30.8]
      Geometry:
        shape: box
        size: [0.4, 0.2, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.75, 0.75, 0.72]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.4, 0.2, 2]

  - name: character-step-2
    components:
      Transform:
        position: [7.6, 0.2, -30.8]
      Geometry:
        shape: box
        size: [0.4, 0.4, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.75, 0.75, 0.72]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.4, 0.4, 2]

  - name: character-step-3
    components:
      Transform:
        position: [8, 0.3, -30.8]
      Geometry:
        shape: box
        size: [0.4, 0.6, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.75, 0.75, 0.72]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.4, 0.6, 2]

  - name: character-step-4
    components:
      Transform:
        position: [8.4, 0.4, -30.8]
      Geometry:
        shape: box
        size: [0.4, 0.8, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.75, 0.75, 0.72]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.4, 0.8, 2]

  - name: character-platform
    components:
      Transform:
        position: [9.8, 0.5, -30.8]
      Geometry:
        shape: box
        size: [2.4, 1, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.75, 0.75, 0.72]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [2.4, 1, 2]

  - name: character-ramp
    components:
      Transform:
        position: [9.8, 0, -28.8]
      Geometry:
        shape: ramp
        size: [2.4, 1, 2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.35, 0.75, 0.4]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: convex_hull

  - name: character-steep
    components:
      Transform:
        position: [6.2, 0, -25.2]
        rotation: [0, -90, 0]
      Geometry:
        shape: ramp
        size: [1.6, 2, 1]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.85, 0.25, 0.2]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: convex_hull

  # a kinematic body that a script moves up and down: ride it for a view
  # over the walls
  - name: character-lift
    components:
      Transform:
        position: [4.4, 0.1, -30.6]
      Geometry:
        shape: box
        size: [1.6, 0.2, 1.6]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.8, 0.2]
          roughness: 0.5
      RigidBody:
        kind: kinematic
      Collider:
        shape: box
        size: [1.6, 0.2, 1.6]
      Mover:
        travel: [0, 2.6, 0]
        period: 10

  # another character, walked back and forth by a script. It stops at you
  - name: character-walker
    components:
      Transform:
        position: [4.2, 0.9, -26.8]
      CharacterBody: Default
      Collider:
        shape: capsule
        radius: 0.3
        height: 1.8
      Patrol:
        speed: 1.5
        distance: 5.5
    children:
      - name: body
        components:
          Transform: Default
          Geometry:
            shape: cylinder
            size: [0.6, 1.2, 0.6]
            sides: 24
            smooth: true
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [0.9, 0.5, 0.2]
              roughness: 0.6
      - name: head
        components:
          Transform:
            position: [0, 0.6, 0]
          Geometry:
            shape: sphere
            size: [0.6, 0.6, 0.6]
            sides: 24
            smooth: true
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [0.9, 0.5, 0.2]
              roughness: 0.6
      - name: feet
        components:
          Transform:
            position: [0, -0.6, 0]
          Geometry:
            shape: sphere
            size: [0.6, 0.6, 0.6]
            sides: 24
            smooth: true
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [0.9, 0.5, 0.2]
              roughness: 0.6

  # --------------------------------------------------------------------------
  # 09 Scripts
  # Components and systems declared in Lua, under assets/scripts, and written
  # here as any component of the engine is, see docs/scripting.md.
  # --------------------------------------------------------------------------

  - name: scripts-spinner-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -38.6]

  # spinner.lua turns it about y
  - name: scripts-spinner
    components:
      Transform:
        position: [-5.5, 1.6, -38.6]
      Geometry:
        shape: box
        size: [0.6, 0.6, 0.6]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [1, 0.5, 0.8]
          roughness: 0.5
      Spinner:
        speed: 90

  - name: scripts-tumbler-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-5.5, 0.5, -37]

  # and about x
  - name: scripts-tumbler
    components:
      Transform:
        position: [-5.5, 1.7, -37]
      Geometry:
        shape: cylinder
        size: [0.3, 0.9, 0.3]
        sides: 6
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [1, 0.5, 0.8]
          roughness: 0.5
      Spinner:
        speed: 140
        axis: x

  - name: scripts-mover-pedestal
    prefab: assets://prefabs/museum/pedestal.prefab.yml
    components:
      Transform:
        position: [-8.5, 0.5, -37.8]

  # mover.lua glides it up and back
  - name: scripts-mover
    components:
      Transform:
        position: [-8.5, 1.5, -37.8]
      Geometry:
        shape: sphere
        size: [0.6, 0.6, 0.6]
        sides: 24
        smooth: true
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.5, 0.8, 1]
          roughness: 0.4
      Mover:
        travel: [0, 1.2, 0]
        period: 3

  # the plate is only drawn. The trigger above it looks for layer 2, which
  # the player alone is in, and trigger-lamp.lua lights the lamp while the
  # player is inside
  - name: scripts-plate
    components:
      Transform:
        position: [-6.5, 0.03, -34]
      Geometry:
        shape: box
        size: [1.6, 0.06, 1.6]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.95, 0.85, 0.1]
          roughness: 0.6

  - name: scripts-plate-trigger
    components:
      Transform:
        position: [-6.5, 1, -34]
      Trigger:
        mask: [2]
      Collider:
        shape: box
        size: [1.6, 2, 1.6]
      TriggerLamp:
        lamp: scripts-lamp

  - name: scripts-lamp-post
    components:
      Transform:
        position: [-9.4, 1.1, -34]
      Geometry:
        shape: box
        size: [0.1, 2.2, 0.1]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.1, 2.2, 0.1]

  # dark until the script gives it light
  - name: scripts-lamp
    components:
      Transform:
        position: [-9.4, 2.35, -34]
      Geometry:
        shape: sphere
        size: [0.3, 0.3, 0.3]
        sides: 16
        smooth: true
      Renderable:
        shader: engine://shaders/color
        material:
          color: [1, 0.85, 0.5]
      Light:
        type: point
        diffuse: [0, 0, 0]
        constant: 1
        linear: 0.14
        quadratic: 0.07

  # --------------------------------------------------------------------------
  # 10 Surfaces
  # A user interface is laid out and drawn on a surface. The window is one;
  # every sign of the museum is one; so is this terminal, whose buttons take
  # the pointer from where the player looks, within its reach, and call
  # functions of terminal.lua by name: Unlock slides the door of the safe
  # next to it, and Alarm has the lamp above it blink. A camera draws into a texture
  # as well, which the second screen shows. See
  # docs/user-interface.md#surfaces.
  # --------------------------------------------------------------------------

  - name: surfaces-desk
    components:
      Transform:
        position: [7.6, 0.45, -37.6]
      Geometry:
        shape: box
        size: [0.5, 0.9, 2.2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.5, 0.9, 2.2]

  # a quad of 1 by 1, sized by its Transform, is the square a surface is
  # pointed at on
  - name: surfaces-terminal
    components:
      Transform:
        position: [7.3, 1.6, -37.6]
        rotation: [0, -90, 0]
        scale: [1.6, 1.2, 1]
      Geometry:
        shape: quad
      Renderable:
        shader: engine://shaders/unlit
        textures:
          - surface://museum-terminal
      UiSurface:
        ui: assets://ui/museum/terminal.ui.yml
        name: museum-terminal
        size: [1024, 768]
      # what its buttons call, see scripts/terminal.lua
      Terminal:
        ui: museum-terminal
        door: surfaces-safe-door
        lamp: surfaces-alarm-lamp

  - name: surfaces-terminal-back
    components:
      Transform:
        position: [7.36, 1.6, -37.6]
      Geometry:
        shape: box
        size: [0.08, 1.3, 1.7]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6

  # dark until Alarm is clicked, and then it blinks
  - name: surfaces-alarm-lamp
    components:
      Transform:
        position: [7.2, 2.5, -37.6]
      Geometry:
        shape: sphere
        size: [0.22, 0.22, 0.22]
        sides: 16
        smooth: true
      Renderable:
        shader: engine://shaders/color
        material:
          color: [0.75, 0.1, 0.08]
      Light:
        type: point
        diffuse: [0, 0, 0]
        constant: 1
        linear: 0.14
        quadratic: 0.07

  # the safe between the two screens: a block on the wall, what it keeps,
  # and the door in front of that, which Unlock slides up
  - name: surfaces-safe
    components:
      Transform:
        position: [7.6, 1.6, -35.9]
      Geometry:
        shape: box
        size: [0.5, 1.1, 1.1]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6

  - name: surfaces-safe-gold
    components:
      Transform:
        position: [7.33, 1.6, -35.9]
      Geometry:
        shape: box
        size: [0.04, 0.6, 0.6]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.1, 0.08, 0.02]
          roughness: 0.4
          emissive: [1, 0.55, 0.08]
          emissive_strength: 1

  - name: surfaces-safe-door
    components:
      Transform:
        position: [7.29, 1.6, -35.9]
      Geometry:
        shape: box
        size: [0.04, 0.9, 0.9]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.62, 0.65, 0.7]
          metallic: 0.2
          roughness: 0.4

  - name: surfaces-stand
    components:
      Transform:
        position: [7.6, 0.45, -34.2]
      Geometry:
        shape: box
        size: [0.5, 0.9, 2.2]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.5, 0.9, 2.2]

  # what the camera at the end of the corridor sees
  - name: surfaces-monitor
    components:
      Transform:
        position: [7.3, 1.6, -34.2]
        rotation: [0, -90, 0]
        scale: [1.2, 1.2, 1]
      Geometry:
        shape: quad
      Renderable:
        shader: engine://shaders/unlit
        textures:
          - surface://security

  - name: surfaces-monitor-back
    components:
      Transform:
        position: [7.36, 1.6, -34.2]
      Geometry:
        shape: box
        size: [0.08, 1.3, 1.3]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6

  # On the north wall, looking back down the corridor. Its picture is that
  # of a monitor: darker towards its corners, which is taken from the light
  # of what it sees, and with the rows of a tube, which are laid over the
  # picture that is shown.
  - name: surfaces-camera
    components:
      Transform:
        position: [0, 3.6, -49.6]
        rotation: [-20, 180, 0]
      Camera:
        target: texture
        texture: security
        size: [512, 512]
        fov: 60
        effects:
          - engine://shaders/effects/vignette
        screen_effects:
          - engine://shaders/effects/scan-lines

  - name: surfaces-camera-case
    components:
      Transform:
        position: [0, 3.6, -49.8]
      Geometry:
        shape: box
        size: [0.3, 0.2, 0.3]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.4

  # --------------------------------------------------------------------------
  # 11 Sound
  # A spatial sound on an orb that a Spinner carries round a post: it is
  # louder from close by, moves from ear to ear, and shifts in pitch as it
  # comes and goes. Its falloff is the inverse one, as sound fades in the open:
  # full within a meter, a third at three, a tenth at ten, and next to nothing
  # at the entrance. A `max_distance` beyond the museum keeps it fading all the
  # way; `falloff: linear` would end it in silence at that distance instead. What hears it is the SoundListener on the camera.
  # --------------------------------------------------------------------------

  - name: sound-post
    components:
      Transform:
        position: [-7, 0.7, -44]
      Geometry:
        shape: box
        size: [0.15, 1.4, 0.15]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.15, 1.4, 0.15]

  - name: sound-carousel
    components:
      Transform:
        position: [-7, 1.4, -44]
      Geometry:
        shape: box
        size: [4.4, 0.06, 0.06]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.6
      Spinner:
        speed: 50
    children:
      - name: orb
        components:
          Transform:
            position: [2.2, 0, 0]
          Geometry:
            shape: sphere
            size: [0.5, 0.5, 0.5]
            sides: 24
            smooth: true
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [1, 0.7, 0.3]
              roughness: 0.3
          SoundSource:
            sound: assets://sounds/hum.wav
            looping: true
            spatial: true
            volume: 0.6
            min_distance: 1
            max_distance: 60
      - name: weight
        components:
          Transform:
            position: [-2.2, 0, 0]
          Geometry:
            shape: box
            size: [0.3, 0.3, 0.3]
          Renderable:
            shader: engine://shaders/pbr
            material:
              color: [0.12, 0.13, 0.15]
              roughness: 0.6

  # --------------------------------------------------------------------------
  # 12 Prefabs and scenes
  # A prefab is an entity described once in a file of its own, see
  # docs/prefabs.md. The scene places it and writes what differs: here a
  # stack of three, as it is, moved, turned, recolored, and with a child
  # taken away. The arch is the way out of the scene, into the same scene.
  # --------------------------------------------------------------------------

  # as the file says it
  - name: prefabs-stack-1
    prefab: assets://prefabs/museum/stack.prefab.yml
    components:
      Transform:
        position: [5.4, 0, -47]

  # turned
  - name: prefabs-stack-2
    prefab: assets://prefabs/museum/stack.prefab.yml
    components:
      Transform:
        position: [5.4, 0, -45.5]
        rotation: [0, 30, 0]

  # larger
  - name: prefabs-stack-3
    prefab: assets://prefabs/museum/stack.prefab.yml
    components:
      Transform:
        position: [5.4, 0, -44]
        scale: 1.4

  # a child changed: the top is red and shines
  - name: prefabs-stack-4
    prefab: assets://prefabs/museum/stack.prefab.yml
    components:
      Transform:
        position: [5.4, 0, -42.5]
    children:
      - name: top
        components:
          Renderable:
            material:
              color: [0.9, 0.15, 0.12]
              roughness: 0.15

  # a child taken away
  - name: prefabs-stack-5
    prefab: assets://prefabs/museum/stack.prefab.yml
    components:
      Transform:
        position: [5.4, 0, -41]
    children:
      - top: ~

  # the arch, and the way out behind its pane
  - name: prefabs-arch-south
    components:
      Transform:
        position: [9.6, 1.2, -42.9]
      Geometry:
        shape: box
        size: [0.3, 2.4, 0.3]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.6, 0.65, 1]
          roughness: 0.4
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.3, 2.4, 0.3]

  - name: prefabs-arch-north
    components:
      Transform:
        position: [9.6, 1.2, -45.1]
      Geometry:
        shape: box
        size: [0.3, 2.4, 0.3]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.6, 0.65, 1]
          roughness: 0.4
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.3, 2.4, 0.3]

  - name: prefabs-arch-top
    components:
      Transform:
        position: [9.6, 2.55, -44]
      Geometry:
        shape: box
        size: [0.3, 0.3, 2.5]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.6, 0.65, 1]
          roughness: 0.4
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.3, 0.3, 2.5]

  - name: prefabs-arch-pane
    components:
      Transform:
        position: [9.6, 1.2, -44]
      Geometry:
        shape: box
        size: [0.04, 2.4, 1.9]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.6, 0.65, 1, 0.35]
          roughness: 0.2
          alpha_mode: blend

  # a trigger reports static bodies too, so it looks for layer 2
  - name: prefabs-exit
    components:
      Transform:
        position: [10.3, 1.2, -44]
      Trigger:
        mask: [2]
      Collider:
        shape: box
        size: [0.6, 2.4, 1.9]
      SceneExit:
        scene: assets://scenes/demo.scene.yml

  # --------------------------------------------------------------------------
  # The visitor
  # The player walks the museum from the first person: a CharacterBody with a
  # capsule, driven by the input map, with the camera at its eyes. The window
  # shows a dot where the player looks, from a user interface of its own.
  # --------------------------------------------------------------------------

  - name: hud
    components:
      Ui:
        file: assets://ui/museum/hud.ui.yml

  # in layer 2 as well, which the triggers of the museum look for. `fov` is
  # the field of view up and down: 59 degrees is 90 across a window of 16 by 9
  - name: player
    components:
      Transform:
        position: [0, 0.9, 4.5]
      Player: Default
      CharacterBody:
        layers: [1, 2]
      Collider:
        shape: capsule
        radius: 0.4
        height: 1.8
    children:
      - name: camera
        components:
          Transform: Default
          Camera:
            fov: 59
          SoundListener: Default
