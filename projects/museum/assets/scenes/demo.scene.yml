# The scene NeonRuntime shows when it is started without one: a museum of
# what the engine does, to walk through.
#
#   NeonRuntime
#
# A corridor with twelve halls, each with a sign that says what it shows:
#
#   01 Shapes        02 Materials      03 Lights       04 Transparency
#   05 Shadows       06 Physics        07 Joints       08 Character
#   09 Scripts       10 Surfaces       11 Sound        12 Prefabs and scenes
#
# The odd halls are on the west side, to the left of the way in, and the
# even ones on the east. Walk with W, A, S, D, look with the mouse, jump
# with space, run with the left shift, and pause with escape.
#
# Nothing but the sky comes from a model file or an image: every piece is a
# Geometry in meters, drawn in a plain color, and every sign is a user
# interface. The sky is a panorama painted by a script.
# Models of our own take their places later. The scripts are under
# assets/scripts, the prefabs under assets/prefabs/museum, and the signs
# under assets/ui/museum.
#
# An entity has a name, the components it carries, and the entities below it.
# What a component leaves out keeps its default. The components and what they
# hold are listed in docs/scenes.md.

scene: demo
version: 1

entities:
  # --------------------------------------------------------------------------
  # The building
  # A corridor runs north from the entrance, along -z, with six halls on each
  # side, 8 meters square. Everything is a box with a box collider: walls that
  # are solid cast shadows, which a room turned inside out would not.
  # --------------------------------------------------------------------------

  # the one light that casts shadows. It shines from the west, so the
  # shadows of the west halls fall towards the corridor
  - name: sun
    components:
      Transform: Default
      Light:
        type: direction
        direction: [0.6, -1, -0.25]
        ambient: [0.22, 0.23, 0.26]
        diffuse: [0.9, 0.87, 0.8]

  # a day sky as one panorama around the camera. Its sun stands where the
  # light above comes from, so the shadows fall away from it; the image is
  # written by tools/make-sky-images.py
  - name: sky
    components:
      Sky:
        type: sphere
        texture: assets://textures/sky/museum-panorama.png

