  - name: lights-front-south
    components:
      Transform:
        position: [-3, 1.5, -9.4]
      Geometry:
        shape: box
        size: [0.3, 3, 2.9]
      Renderable:
        shader: engine://shaders/pbr
        material:
          color: [0.12, 0.13, 0.15]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.3, 3, 2.9]

  - name: lights-front-north
