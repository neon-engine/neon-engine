# The sandbox: the project the engine is tried out with, one scene that says
# that it runs. NeonRuntime ships no game of its own; a game is a project, as
# this one is, put together next to a copy of the runtime.
#
# `name` and `organization` place user://, the folder the project writes to,
# so they are plain names that work as folder names on every platform. The
# scenes are listed so that the editor and the exporter know what belongs to
# the project. It names no `input`, so the game is played with the engine's
# own map, engine://input/default.input.yml, see docs/input.md. What the file
# holds is described in docs/projects.md.
#
# `graphics_presets` changes the quality presets the settings menu offers
# and `rendering.quality` names: the engine's low, medium, high, and ultra
# are there without a word; `potato` is one more, for a machine that
# struggles, with the engine's default for every value it leaves out.

version: 1
name: neon-sandbox
organization: neon-engine

scenes:
  - assets://scenes/start.scene.yml

entry_scene: assets://scenes/start.scene.yml

graphics_presets:
  potato:
    anisotropy: 1
    texture_scale: 0.25
    target_scale: 0.5
    shadow_map_size: 512
    shadow_filter: none
    shadow_cascades: 1
    shadow_distance: 20

# The settings of the game itself: what each holds, its default, and where
# and how the settings menu shows it, which builds a section per category
# after the engine's rows, with a heading per group and a control per
# setting. The scripts read them with settings.get and hear of a change with
# settings.on_change; settings.yml and the player's file set them under
# `game`. The sandbox reads none of them yet; they are the example, see
# docs/projects.md and docs/settings.md.
settings:
  show_hints:
    kind: flag
    default: true
    category: Gameplay
    order: 1
    label: Show hints
  reset_progress:
    kind: action
    category: Gameplay
    order: 2
    label: Reset progress
  look_sensitivity:
    kind: number
    default: 1
    least: 0.1
    most: 5
    step: 0.1
    category: Controls
    group: Camera
    order: 1
  invert_look:
    kind: flag
    default: false
    control: checkbox
    category: Controls
    group: Camera
    order: 2
  text_size:
    kind: choice
    default: normal
    choices:
      - small
      - normal
      - large
    category: Accessibility
    order: 3
