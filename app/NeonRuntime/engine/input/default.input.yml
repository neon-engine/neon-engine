# The input map the engine brings, engine://input/default.input.yml: the
# actions a game reads, what is bound to each, and the states that say which
# are live. A project that names no `input` in its project.yml is played
# with it; one that names a map of its own is played with that instead. What the file holds is
# described in docs/input.md.
#
# An axis2 is put together from four keys or buttons in the order up, down,
# left, right, from a stick, and from the motion of the mouse. A button is
# down while any of its keys and buttons is. `rate` is how many pixels a
# second a stick pushed all the way counts for, so that it turns the view as
# a mouse does.

version: 1

actions:
  move:  { type: axis2, keys: [w, s, a, d], stick: left }
  look:  { type: axis2, mouse: motion, stick: right, rate: 600 }
  jump:  { type: button, keys: [space], buttons: [south] }
  run:   { type: button, keys: [left-shift], buttons: [left-stick] }
  pause: { type: button, keys: [escape], buttons: [start] }

states:
  playing: [move, look, jump, run, pause]
  menu:    [pause]
