# The settings menu the engine brings, engine://ui/settings.ui.yml, which a
# project shows by naming it as ui.settings_menu in its settings.yml. It
# shows what a user interface can do besides a HUD: a list that scrolls, text
# that is typed, boxes that are ticked, a slider, a dropdown, and buttons,
# with a theme in a style sheet. It is shown with
#
#   NeonRuntime --ui engine://ui/settings.ui.yml
#
# or by a scene that names it, as settings-demo.scene.yml of the tests. The look is in
# settings.css; this file says what there is.

ui: settings
version: 1

reference_size: [1920, 1080]

# It takes the input while it is shown, so the cursor is there to use it,
# and the game has the mouse back once it is closed: with escape or a
# controller's cancel, or with Back or Apply
modal: true
cancel: close

styles:
  - settings.css

values:
  player_name: Ada
  vsync: true
  # the volumes of the groups of sounds, from 0 to 100, as the engine
  # starts them; the runtime, or a UiVolume of the scene, sets them to the
  # volumes the groups have when the menu is shown
  effects: 100
  music: 100
  ambience: 100
  track: chilled
  # the graphics, as the engine starts them; the runtime sets them to what
  # holds when it shows the menu
  window_mode: windowed
  max_fps: "0"
  anisotropy: "8"
  texture_scale: "1"
  target_scale: "1"
  target_mipmaps: "0"
  shadows: true
  shadow_map_size: "2048"
  shadow_filter: pcf
  shadow_cascades: "4"
  shadow_distance: 120
  tonemapper: none
  exposure: 1
  difficulty: normal
  notes: ""

root:
  type: panel
  name: backdrop
  class: backdrop
  children:
    - type: panel
      name: window
      class: window
      children:
        - type: label
          class: title
          text: Settings

        # everything that can be changed, in a list that scrolls
        - type: panel
          name: list
          class: list
          children:
            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Player name}
                - type: input
                  name: player-name
                  value: "{player_name}"
                  placeholder: Your name
                  max_length: 24

            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Display}
                - type: panel
                  class: choices
                  children:
                    - {type: toggle, name: vsync, text: V-Sync, checked: "{vsync}"}

            # The graphics, each a setting of the engine: the runtime shows them
            # as they are when the menu opens, changes them as they are chosen,
            # keeps them in user://settings.yml with Apply, and puts them back
            # with Back, see GraphicsMenu. The size of the textures and of the
            # camera pictures holds for the scene that is loaded next
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Window
                - type: select
                  name: window_mode
                  value: "{window_mode}"
                  options:
                    - value: "windowed"
                      text: Windowed
                    - value: "borderless"
                      text: Borderless
                    - value: "fullscreen"
                      text: Full screen

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Frame limit
                - type: select
                  name: max_fps
                  value: "{max_fps}"
                  options:
                    - value: "0"
                      text: None
                    - value: "30"
                      text: 30
                    - value: "60"
                      text: 60
                    - value: "120"
                      text: 120
                    - value: "144"
                      text: 144
                    - value: "240"
                      text: 240

            # anisotropic filtering: samples a texture is read with from the side
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Texture filtering
                - type: select
                  name: anisotropy
                  value: "{anisotropy}"
                  options:
                    - value: "1"
                      text: Off
                    - value: "2"
                      text: 2x
                    - value: "4"
                      text: 4x
                    - value: "8"
                      text: 8x
                    - value: "16"
                      text: 16x

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Texture size
                - type: select
                  name: texture_scale
                  value: "{texture_scale}"
                  options:
                    - value: "1"
                      text: Full
                    - value: "0.5"
                      text: Half
                    - value: "0.25"
                      text: Quarter
                    - value: "0.125"
                      text: Eighth

            # what a camera draws into a texture: its size, and its smaller copies
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Camera pictures
                - type: select
                  name: target_scale
                  value: "{target_scale}"
                  options:
                    - value: "1"
                      text: Full
                    - value: "0.5"
                      text: Half
                    - value: "0.25"
                      text: Quarter

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Camera detail
                - type: select
                  name: target_mipmaps
                  value: "{target_mipmaps}"
                  options:
                    - value: "0"
                      text: All
                    - value: "8"
                      text: 8 levels
                    - value: "4"
                      text: 4 levels
                    - value: "2"
                      text: 2 levels
                    - value: "1"
                      text: None

            # whether the direction light casts at all: off skips the
            # shadow pass; then how fine its map is, how its edges are
            # softened, its cascades, and how far its shadows reach
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Shadows
                - type: panel
                  class: choices
                  children:
                    - type: toggle
                      name: shadows
                      text: On
                      checked: "{shadows}"

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Shadow map
                - type: select
                  name: shadow_map_size
                  value: "{shadow_map_size}"
                  options:
                    - value: "512"
                      text: 512
                    - value: "1024"
                      text: 1024
                    - value: "2048"
                      text: 2048
                    - value: "4096"
                      text: 4096

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Shadow edges
                - type: select
                  name: shadow_filter
                  value: "{shadow_filter}"
                  options:
                    - value: "none"
                      text: Hard
                    - value: "pcf"
                      text: Soft

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Shadow cascades
                - type: select
                  name: shadow_cascades
                  value: "{shadow_cascades}"
                  options:
                    - value: "1"
                      text: 1
                    - value: "2"
                      text: 2
                    - value: "3"
                      text: 3
                    - value: "4"
                      text: 4

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Shadow distance
                - type: panel
                  class: with-value
                  children:
                    - type: slider
                      name: shadow_distance
                      min: 20
                      max: 300
                      step: 10
                      value: "{shadow_distance}"
                    - type: label
                      class: value
                      text: "{shadow_distance} m"

            # the curve light brighter than white goes through, and the brightness
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Tone mapping
                - type: select
                  name: tonemapper
                  value: "{tonemapper}"
                  options:
                    - value: "none"
                      text: None
                    - value: "aces"
                      text: ACES
                    - value: "agx"
                      text: AgX

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Exposure
                - type: panel
                  class: with-value
                  children:
                    - type: slider
                      name: exposure
                      min: 0.25
                      max: 4
                      step: 0.25
                      value: "{exposure}"
                    - type: label
                      class: value
                      text: "{exposure}"

            # the volumes of the groups of sounds: each slider is a value
            # named after its group, which the runtime hands to the group
            # while the menu is shown, and keeps with Apply. A project with
            # a group of its own adds a row like this one, with a value
            # named after the group
            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Effects
                - type: panel
                  class: with-value
                  children:
                    - type: slider
                      name: effects
                      min: 0
                      max: 100
                      step: 5
                      value: "{effects}"
                    - type: label
                      class: value
                      text: "{effects}"

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Music
                - type: panel
                  class: with-value
                  children:
                    - type: slider
                      name: music
                      min: 0
                      max: 100
                      step: 5
                      value: "{music}"
                    - type: label
                      class: value
                      text: "{music}"

            - type: panel
              class: row
              children:
                - type: label
                  class: row-label
                  text: Ambience
                - type: panel
                  class: with-value
                  children:
                    - type: slider
                      name: ambience
                      min: 0
                      max: 100
                      step: 5
                      value: "{ambience}"
                    - type: label
                      class: value
                      text: "{ambience}"

            # which piece of music plays: the scene fades from one to the
            # next when another is chosen
            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Track}
                - type: panel
                  class: choices
                  children:
                    - {type: radio, name: chilled, group: track, value: chilled, text: Chilled, checked: "{track}"}
                    - {type: radio, name: fight, group: track, value: fight, text: Fight, checked: "{track}"}
                    - {type: radio, name: hollow, group: track, value: hollow, text: Hollow, checked: "{track}"}

            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Difficulty}
                - type: panel
                  class: choices
                  children:
                    - {type: radio, name: easy, group: difficulty, value: easy, text: Easy, checked: "{difficulty}"}
                    - {type: radio, name: normal, group: difficulty, value: normal, text: Normal, checked: "{difficulty}"}
                    - {type: radio, name: hard, group: difficulty, value: hard, text: Hard, checked: "{difficulty}"}

            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Notes}
                - type: textarea
                  name: notes
                  value: "{notes}"
                  placeholder: Anything to remember
                  rows: 3

            - type: panel
              class: row
              children:
                - {type: label, class: row-label, text: Language}
                - type: select
                  name: language
                  options: [English, Deutsch, Español, Français, Italiano, 日本語, Português, Русский, 中文]
                  value: English

        - type: panel
          class: actions
          children:
            - {type: button, name: back, class: secondary, text: Back, action: close, title: Back to the game}
            - {type: button, name: apply, class: primary, text: Apply, action: close, autofocus: true, title: Keep these settings}
