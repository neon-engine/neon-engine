# The demo scene with the settings menu over it:
#
#   NeonRuntime --scene assets://scenes/settings-demo.scene.yml
#
# The menu is a component of an entity, as the HUD of hud-demo is. Escape
# and a controller's cancel close it, as its file says.
#
# The menu sets what is heard. The Effects and Music sliders are the volumes
# of those groups of sounds, through UiVolume, and choosing a track fades
# from one piece of music to another, through UiSoundSwitch. The reactor
# hums by the bear, among the effects.
#
# The music and the reactor come from a paid Humble Bundle, which is kept in
# Git LFS and may not be passed on as it is.

scene: settings-demo
version: 1

entities:
  - name: settings
    components:
      Ui:
        file: assets://ui/settings.ui.yml

  - name: bear
    components:
      Transform: {}
      Renderable:
        model: assets://models/bear.obj
        shader: assets://shaders/basic-lit
        textures:
          - assets://textures/concrete.png
        material:
          shininess: 32
          color: [1, 0.5, 0.31]

  - name: floor
    components:
      Transform:
        position: [0, -0.55, 0]
        scale: [100, 0.1, 100]
      Renderable:
        model: assets://models/cube.obj
        shader: assets://shaders/basic-lit
        textures:
          - assets://textures/concrete.png
        scale_textures: true
        material:
          shininess: 32
          color: [0.5, 0.5, 0.5]

  - name: direction
    components:
      Transform:
        position: [1.2, 1, -2]
      Light:
        type: direction
        direction: [-0.2, -1, -0.3]
        ambient: [0.5, 0.5, 0.5]
        diffuse: [0.4, 0.4, 0.4]
        specular: [0.5, 0.5, 0.5]

  - name: player
    components:
      Transform:
        position: [0, 0, 2]
      Spectator: {}
    children:
      - name: camera
        components:
          Transform: {}
          Camera: {}
          SoundListener: {}

  # the sliders of the menu are the volumes of two groups, from 0 to 100
  - name: effects volume
    components:
      UiVolume:
        value: volume
        group: effects

  - name: music volume
    components:
      UiVolume:
        value: music
        group: music

  # one entity for each piece of music. The one the menu chooses plays, and
  # a new choice fades from it to the next over two seconds
  - name: chilled
    components:
      Transform: {}
      SoundSource:
        sound: assets://sounds/music/electronic-chilled.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: chilled
        fade: 2

  - name: fight
    components:
      Transform: {}
      SoundSource:
        sound: assets://sounds/music/electronic-fight.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: fight
        fade: 2

  - name: hollow
    components:
      Transform: {}
      SoundSource:
        sound: assets://sounds/music/electronic-hollow.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: hollow
        fade: 2

  # an effect with a place: louder close to the bear, and heard from the
  # side it is on
  - name: reactor
    components:
      Transform: {}
      SoundSource:
        sound: assets://sounds/ambience/reactor-room.wav
        looping: true
        spatial: true
        max_distance: 20
