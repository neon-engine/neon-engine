# A scene under a sky of type box, to look around in:
#
#   NeonRuntime --scene assets://scenes/sky-box.scene.yml
#
# The sky is six images, the faces of a cube. sky-sphere.scene.yml is this
# scene with the same sky as one panorama, and shows the same picture.
#
# The sun of the sky stands ahead and to the right of where the scene
# starts, and the direction light shines from it. The pane is see-through,
# and shows the sky behind it tinted. The images are written by
# tools/make-sky-images.py.

scene: sky-box
version: 1

entities:
  # six images, the faces of a cube seen from its middle
  - name: sky
    components:
      Sky:
        type: box
        faces:
          right: assets://textures/sky/day-right.png
          left: assets://textures/sky/day-left.png
          top: assets://textures/sky/day-top.png
          bottom: assets://textures/sky/day-bottom.png
          front: assets://textures/sky/day-front.png
          back: assets://textures/sky/day-back.png

  # from where the sun of the sky stands
  - name: sun
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.5, -0.45, 0.74]
        ambient: [0.35, 0.4, 0.5]
        diffuse: [1, 0.95, 0.85]
        specular: [0.5, 0.5, 0.5]

  - name: floor
    components:
      Transform:
        position: [0, -0.5, 0]
      Geometry:
        shape: plane
        size: [20, 0, 20]
      Renderable:
        shader: assets://shaders/pbr
        textures:
          - assets://textures/concrete.png
        material:
          color: [0.6, 0.6, 0.6]
          roughness: 0.9

  - name: bear
    components:
      Transform:
        position: [0, 0, -2]
      Renderable:
        model: assets://models/bear.obj
        fit: unit
        shader: assets://shaders/pbr
        material:
          color: [1, 0.5, 0.31]
          roughness: 0.6

  - name: pane
    components:
      Transform:
        position: [1.5, 0.5, -2]
        scale: 1.5
      Renderable:
        model: assets://models/quad.obj
        fit: unit
        shader: assets://shaders/color
        material:
          color: [0.2, 0.9, 0.6, 0.4]
          alpha_mode: blend
          double_sided: always

  - name: player
    components:
      Transform:
        position: [0, 0.5, 2]
      Spectator: Default
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
