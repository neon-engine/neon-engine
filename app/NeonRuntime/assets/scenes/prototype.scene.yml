# The first level of the prototype game, blocked out from Kenney's Prototype
# Kit and Blaster Kit (assets/external/kenney, CC0). Start it with
#
#   NeonRuntime --scene assets://scenes/prototype.scene.yml
#
# A room of 6 by 6 with a doorway in its south wall, and a corridor of 2 by 6
# behind the doorway. Columns stand in the corners of the room, a crate and a
# supply crate with a blaster on it stand in the room, and a target hangs on
# each end wall. The reactor hums, as ambience. The player starts in the corridor, facing
# the doorway, and walks with the actions of the input map: W, A, S, D, the
# mouse to look, space to jump, and the left shift to run. A walker crosses
# the room and slides along its north wall, as the character of
# physics.scene.yml does.
#
# The kit pieces are in metres and stand on their origin, and are drawn so,
# as the file says: the `fit` of a Renderable is `none` unless written. A
# wall of the kit is 1 wide and 1 high along z and 0.2 thick along x, a floor
# tile 1 by 1, a column 0.2 by 1 by 0.2, a crate a cube of 0.5. The scale of
# a Transform below stretches a piece to the length and height it has here:
# the walls are 2.5 high. A collider is written in the piece's own metres,
# since the scale of the Transform sizes it as it sizes what is drawn, so
# that nothing falls through or walks through the walls.
#
# The way out is the north-east corner of the room, behind the supply crate:
# an exit the player walks into, which changes to end.scene.yml, see
# docs/scenes.md#changing-the-scene. The title screen, title.scene.yml,
# comes before the level.
#
# The walls, the floors, the columns, and the targets are prefabs from
# assets/prefabs, described once there with their model, body, and collider;
# the scene places each with `prefab:` and writes only its Transform on top,
# see docs/prefabs.md. The components and what they hold are listed in
# docs/scenes.md, and what the loader reads of a GLB in docs/models.md.

scene: prototype
version: 1

entities:
  # the room

  - name: room-floor
    prefab: assets://prefabs/floor-tile.prefab.yml
    components:
      Transform:
        position: [0, 0, 0]
        scale: [6, 1, 6]

  - name: room-north-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [0, 0, -3]
        rotation: [0, 90, 0]
        scale: [1, 2.5, 6]

  - name: room-east-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [3, 0, 0]
        scale: [1, 2.5, 6]

  - name: room-west-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [-3, 0, 0]
        scale: [1, 2.5, 6]

  # the south wall, in two parts with the doorway between them. The opening
  # of the doorway piece is 0.6 of its width, along its z, and 0.8 of its
  # height, so at 2 wide and 2.5 high it is 1.2 by 2, which the walker fits
  # through. Its colliders are the two posts and the lintel, in the metres
  # of the piece like every collider here.
  - name: room-south-wall-west
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [-2, 0, 3]
        rotation: [0, 90, 0]
        scale: [1, 2.5, 2]

  - name: room-south-wall-east
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [2, 0, 3]
        rotation: [0, 90, 0]
        scale: [1, 2.5, 2]

  - name: doorway
    components:
      Transform:
        position: [0, 0, 3]
        rotation: [0, 90, 0]
        scale: [1, 2.5, 2]
      Renderable:
        model: assets://external/kenney/prototype-kit/wall-doorway.glb
        shader: assets://shaders/basic-lit
      RigidBody:
        kind: static
    children:
      - name: west-post
        components:
          Transform:
            position: [0, 0.5, -0.4]
          Collider:
            shape: box
            size: [0.3, 1, 0.2]
      - name: east-post
        components:
          Transform:
            position: [0, 0.5, 0.4]
          Collider:
            shape: box
            size: [0.3, 1, 0.2]
      - name: lintel
        components:
          Transform:
            position: [0, 0.9, 0]
          Collider:
            shape: box
            size: [0.3, 0.2, 1]

  - name: columns
    children:
      - name: north-west
        prefab: assets://prefabs/column.prefab.yml
        components:
          Transform:
            position: [-2.7, 0, -2.7]
            scale: 2.5
      - name: north-east
        prefab: assets://prefabs/column.prefab.yml
        components:
          Transform:
            position: [2.7, 0, -2.7]
            scale: 2.5
      - name: south-west
        prefab: assets://prefabs/column.prefab.yml
        components:
          Transform:
            position: [-2.7, 0, 2.7]
            scale: 2.5
      - name: south-east
        prefab: assets://prefabs/column.prefab.yml
        components:
          Transform:
            position: [2.7, 0, 2.7]
            scale: 2.5

  # the props

  - name: crate
    components:
      Transform:
        position: [-1.8, 0, -1.8]
        rotation: [0, 20, 0]
      Renderable:
        model: assets://external/kenney/prototype-kit/crate.glb
        shader: assets://shaders/basic-lit
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: 0.5
        offset: [0, 0.25, 0]

  # a supply crate of the Blaster Kit, 1 long along its z, 0.8 wide with its
  # lid, and 0.23 high, whose origin is a little off its middle and 0.02
  # above its bottom. A blaster lies on it
  - name: supply-crate
    components:
      Transform:
        position: [1.8, 0.02, -1.725]
        rotation: [0, 90, 0]
      Renderable:
        model: assets://external/kenney/blaster-kit/crate-medium.glb
        shader: assets://shaders/basic-lit
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [0.8, 0.23, 1]
        offset: [-0.125, 0.095, 0]

  - name: blaster
    components:
      Transform:
        position: [1.79, 0.46, -1.57]
        rotation: [0, 160, 0]
      Renderable:
        model: assets://external/kenney/blaster-kit/blaster-a.glb
        shader: assets://shaders/basic-lit

  # a target on the north wall of the room, 0.5 high from its origin at its
  # foot, and a small one at the end of the corridor, 0.2 across its middle
  # and made twice as big
  - name: room-target
    prefab: assets://prefabs/target.prefab.yml
    components:
      Transform:
        position: [0, 1.15, -2.85]
        rotation: [0, 90, 0]

  # The way out of the level: a trigger in the north-east corner, behind the
  # supply crate, that changes to the end scene when a body is inside it. A
  # trigger reports static bodies too, and the column and the walls stand in
  # the corner, so it looks for layer 2 alone, which only the player is in.
  - name: exit
    components:
      Transform:
        position: [2.5, 1, -2.5]
      Trigger:
        mask: [2]
      Collider:
        shape: box
        size: [0.8, 2, 0.8]
      SceneExit:
        scene: assets://scenes/end.scene.yml

  - name: corridor-target
    prefab: assets://prefabs/target.prefab.yml
    components:
      Transform:
        position: [0, 1.4, 8.85]
        rotation: [0, -90, 0]
        scale: 2
      Renderable:
        model: assets://external/kenney/blaster-kit/target-small.glb

  # the corridor, south of the doorway

  - name: corridor-floor
    prefab: assets://prefabs/floor-tile.prefab.yml
    components:
      Transform:
        position: [0, 0, 6]
        scale: [2, 1, 6]

  - name: corridor-east-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [1, 0, 6]
        scale: [1, 2.5, 6]

  - name: corridor-west-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [-1, 0, 6]
        scale: [1, 2.5, 6]

  - name: corridor-end-wall
    prefab: assets://prefabs/wall.prefab.yml
    components:
      Transform:
        position: [0, 0, 9]
        rotation: [0, 90, 0]
        scale: [1, 2.5, 2]

  # the lights: daylight from above, and a lamp in the middle of the room

  - name: daylight
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.3, -1, -0.2]
        ambient: [0.35, 0.35, 0.4]
        diffuse: [0.5, 0.5, 0.45]
        specular: [0.2, 0.2, 0.2]

  - name: lamp
    components:
      Transform:
        position: [0, 2.2, 0]
      Light:
        type: point
        ambient: [0.05, 0.04, 0.02]
        diffuse: [0.8, 0.6, 0.3]
        specular: [0.3, 0.3, 0.3]
        constant: 1
        linear: 0.14
        quadratic: 0.07

  # the hum of the reactor, heard the same everywhere. It is ambience: it
  # is held still with the game, as an effect is, and plays on when the
  # music or the effects are stopped
  - name: reactor
    components:
      SoundSource:
        sound: assets://sounds/ambience/reactor-room.wav
        looping: true
        volume: 0.5
        group: ambience

  # the character of physics.scene.yml: it walks north across the room into
  # the wall, and slides along it
  - name: walker
    components:
      Transform:
        position: [-0.5, 1, 1.5]
      CharacterBody:
        velocity: [0.5, 0, -1.5]
      Collider:
        shape: capsule
        radius: 0.4
        height: 1.8
    children:
      - name: looks
        components:
          Transform:
            scale: [0.8, 1.8, 0.8]
          Renderable:
            model: assets://models/cube.obj
            fit: unit
            shader: assets://shaders/basic-lit
            textures:
              - assets://textures/water.png

  # the player, who starts in the corridor and looks through the doorway. A
  # capsule of 1.8 that the physics stands on the floor, with its middle 0.9
  # above it, and the camera lifted to the eyes by the Player
  - name: player
    components:
      Transform:
        position: [0, 0.9, 7.5]
      Player: Default
      # in layer 2 as well, which the exit looks for
      CharacterBody:
        layers: [1, 2]
      Collider:
        shape: capsule
        radius: 0.4
        height: 1.8
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
          SoundListener: Default
