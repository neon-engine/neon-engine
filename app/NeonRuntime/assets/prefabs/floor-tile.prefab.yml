# A floor tile of Kenney's Prototype Kit: 1 by 1, with its top at its
# origin. The scene stretches it over a room with the scale of a Transform;
# the collider is a slab below the top, so that nothing falls through.
version: 1
prefab: floor-tile

entity:
  components:
    Renderable:
      model: assets://external/kenney/prototype-kit/floor-square.glb
      shader: assets://shaders/basic-lit
    RigidBody:
      kind: static
    Collider:
      shape: box
      size: [1, 0.2, 1]
      offset: [0, -0.1, 0]
