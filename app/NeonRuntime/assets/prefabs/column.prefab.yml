# A column of Kenney's Prototype Kit: 0.2 by 1 by 0.2, standing on its
# origin. The scene gives it its place and its height with a Transform.
version: 1
prefab: column

entity:
  components:
    Renderable:
      model: assets://external/kenney/prototype-kit/column.glb
      shader: assets://shaders/basic-lit
    RigidBody:
      kind: static
    Collider:
      shape: box
      size: [0.2, 1, 0.2]
      offset: [0, 0.5, 0]
