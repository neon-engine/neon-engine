# The project NeonRuntime runs: the folder this file is at the root of.
#
# `name` and `organization` place user://, the folder the project writes to,
# so they are plain names that work as folder names on every platform. The
# scenes are listed so that the editor and the exporter know what belongs to
# the project. `input` names the input map the game is played with, see
# docs/input.md. What the file holds is described in docs/projects.md.

version: 1
name: neon-runtime
organization: neon-engine

scenes:
  - assets://scenes/demo.scene.yml
  - assets://scenes/hud-demo.scene.yml
  - assets://scenes/physics.scene.yml
  - assets://scenes/joints.scene.yml
  - assets://scenes/settings-demo.scene.yml
  - assets://scenes/surface-demo.scene.yml
  - assets://scenes/gamma-test.scene.yml
  - assets://scenes/culling-test.scene.yml
  - assets://scenes/pbr-test.scene.yml
  - assets://scenes/shadow-test.scene.yml
  - assets://scenes/shadow-test-unshadowed.scene.yml
  - assets://scenes/title.scene.yml
  - assets://scenes/prototype.scene.yml
  - assets://scenes/end.scene.yml
  - assets://scenes/blockout.scene.yml

entry_scene: assets://scenes/demo.scene.yml

input: assets://input/default.input.yml
