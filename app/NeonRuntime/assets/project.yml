# The project NeonRuntime runs when it is started as it was built, with no
# game put together around it: one scene, which says that it runs. A game is
# a project of its own, as those in projects/, whose assets are laid over the
# runtime's, this file among them.
#
# `name` and `organization` place user://, the folder the project writes to,
# so they are plain names that work as folder names on every platform. The
# scenes are listed so that the editor and the exporter know what belongs to
# the project. `input` names the input map the game is played with, see
# docs/input.md. What the file holds is described in docs/projects.md.

version: 1
name: neon-runtime
organization: neon-engine

scenes:
  - assets://scenes/start.scene.yml

entry_scene: assets://scenes/start.scene.yml

input: assets://input/default.input.yml
