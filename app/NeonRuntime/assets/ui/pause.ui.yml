# The menu the runtime shows when the player pauses: escape, or the start
# button of a controller. NeonRuntime names it in its settings. It is
# modal, so the game sees no input while it is shown, and the world stands
# still.
#
# Resume takes it away, and so does cancel: escape, or the right button of
# a controller. Settings shows the settings menu in its place, and the pause
# menu comes back when that is closed. Quit closes the window. The hint at the bottom follows
# what the player used last, which the user interface says in the values
# `input_device` and `gamepad`.

ui: pause
version: 1

reference_size: [1920, 1080]
modal: true
cancel: close

root:
  type: panel
  width: 100%
  height: 100%
  justify_content: center
  align_items: center
  background_color: "#00000080"
  children:
    # drawn from an image in nine parts, so that its corners stay round at
    # every size
    - type: panel
      name: menu
      padding: 32
      gap: 16
      min_width: 320
      flex_direction: column
      align_items: stretch
      border_image_source: assets://ui/panel.png
      border_image_slice: 16
      children:
        - type: label
          text: Paused
          font_size: 28
          font_weight: bold
          text_align: center
          margin_bottom: 8
        - type: button
          name: resume
          text: Resume
          autofocus: true
          border_radius: 8
          # a band of light that moves over the button
          shader: assets://shaders/ui/shine
          shader_values: { speed: 0.4, width: 0.15, lean: 0.4, tint: "#ffffff50" }
        - type: button
          name: settings
          text: Settings
          border_radius: 8
        - type: button
          name: quit
          text: Quit
          border_radius: 8
        - type: label
          hidden: "{gamepad}"
          text: "Enter chooses, escape resumes"
          font_size: 14
          color: "#ffffff80"
          text_align: center
          margin_top: 8
        - type: label
          hidden: "{!gamepad}"
          text: "A chooses, B resumes"
          font_size: 14
          color: "#ffffff80"
          text_align: center
          margin_top: 8
