# What is shown during play over the demo scene. It is shown with
#
#   NeonRuntime --ui assets://ui/hud.ui.yml
#
# or by a scene that names it, as assets://scenes/hud-demo.scene.yml does.
#
# The properties are those of CSS, with an underscore where CSS has a
# hyphen. What an element leaves out keeps its default. The elements and
# what they hold are listed in docs/user-interface.md.

ui: hud
version: 1

# the size this was made for, which everything grows and shrinks from
reference_size: [1920, 1080]

# what the values are until the game sets them
values:
  health: 75
  player: Ada
  # whether something in the world is pointed at, which the runtime says
  pointing: false

root:
  type: panel
  width: 100%
  height: 100%
  children:
    # pinned to the left top corner
    - type: panel
      position: absolute
      top: 24
      left: 24
      gap: 8
      flex_direction: column
      children:
        - type: panel
          gap: 12
          align_items: center
          children:
            - type: image
              src: assets://ui/heart.png
              width: 32
              height: 32
            - type: label
              name: health
              text: "Health: {health}"
              font_size: 28
              font_weight: bold
              text_shadow: "0 2px 4px #000000c0"
        - type: bar
          value: "{health}"
          max: 100
          width: 240
          height: 12
          background_color: "#00000080"
          accent_color: "#e5484d"
          border_radius: 6
          overflow: hidden
        - type: label
          text: "{player}"
          font_size: 16
          color: "#ffffffb0"

    # a dot in the middle, where the player looks: what is pointed at in
    # the world, such as a screen, is what the dot is on. It becomes a ring
    # while something is pointed at, which the flag `pointing` tells
    - type: panel
      position: absolute
      top: 50%
      left: 50%
      width: 6
      height: 6
      margin_top: -3
      margin_left: -3
      border_radius: 3
      background_color: "#ffffffc0"
      box_shadow: "0 0 3px #000000a0"
      hidden: "{pointing}"
    - type: panel
      position: absolute
      top: 50%
      left: 50%
      width: 18
      height: 18
      margin_top: -9
      margin_left: -9
      border_radius: 9
      border_width: 2
      border_color: "#ffffffe0"
      box_shadow: "0 0 3px #000000a0"
      hidden: "{!pointing}"
