# The end of the prototype game, shown by end.scene.yml once the player has
# walked through the exit of the level. Again asks for the level once more
# and Title for the title screen, both with `action: scene`.

ui: end
version: 1

reference_size: [1920, 1080]
modal: true
cancel: none

root:
  type: panel
  width: 100%
  height: 100%
  justify_content: center
  align_items: center
  children:
    - type: panel
      name: menu
      padding: 48
      gap: 16
      min_width: 400
      flex_direction: column
      align_items: stretch
      border_image_source: assets://ui/panel.png
      border_image_slice: 16
      children:
        - type: label
          text: You made it out
          font_size: 40
          font_weight: bold
          text_align: center
          margin_bottom: 16
        - type: button
          name: again
          text: Play again
          autofocus: true
          border_radius: 8
          action: scene
          scene: assets://scenes/prototype.scene.yml
        - type: button
          name: title
          text: Title
          border_radius: 8
          action: scene
          scene: assets://scenes/title.scene.yml
