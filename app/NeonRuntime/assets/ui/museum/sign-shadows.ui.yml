# The sign of hall 05, shown on a surface of its own by demo.scene.yml.

ui: sign-shadows
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #c9c9c9"
  children:
    - type: label
      text: "05"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#c9c9c9"
    - type: label
      text: "Shadows"
      font_size: 92
      font_weight: bold
    - type: label
      text: "The sun casts cascaded shadow maps, fitted"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "to what the camera sees. The arm turns, and"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "its shadow turns with it. Glass casts none."
      font_size: 36
      color: "#ffffffc8"
