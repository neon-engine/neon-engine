# The sign of the museum, shown on a surface of its own by demo.scene.yml.

ui: sign-title
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #b98cff"
  children:
    - type: label
      text: "NEON ENGINE"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#b98cff"
    - type: label
      text: "Museum"
      font_size: 110
      font_weight: bold
    - type: label
      text: "Twelve halls of what the engine does."
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "Walk in: odd halls on the left, even on the right."
      font_size: 36
      color: "#ffffffc8"
