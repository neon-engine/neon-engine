# The sign of hall 07, shown on a surface of its own by demo.scene.yml.

ui: sign-joints
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #b98cff"
  children:
    - type: label
      text: "07"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#b98cff"
    - type: label
      text: "Joints"
      font_size: 92
      font_weight: bold
    - type: label
      text: "A door on a hinge with a spring, a pendulum"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "on a rope, a block on a slider, a wheel on"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "a motor, two crates fixed as one, a cable."
      font_size: 36
      color: "#ffffffc8"
