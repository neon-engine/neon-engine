# The sign of hall 09, shown on a surface of its own by demo.scene.yml.

ui: sign-scripts
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #ff8ad1"
  children:
    - type: label
      text: "09"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#ff8ad1"
    - type: label
      text: "Scripts"
      font_size: 92
      font_weight: bold
    - type: label
      text: "Lua components and systems: a Spinner, a"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "Mover, and a TriggerLamp. Stand on the"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "yellow plate and the lamp lights up."
      font_size: 36
      color: "#ffffffc8"
