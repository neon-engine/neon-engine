# The sign of hall 11, shown on a surface of its own by demo.scene.yml.

ui: sign-sound
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #ffb36b"
  children:
    - type: label
      text: "11"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#ffb36b"
    - type: label
      text: "Sound"
      font_size: 92
      font_weight: bold
    - type: label
      text: "The orb hums as it circles: louder from"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "close by, heard from the side it is on,"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "and fading as you walk away."
      font_size: 36
      color: "#ffffffc8"
