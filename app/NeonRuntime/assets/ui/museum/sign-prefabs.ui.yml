# The sign of hall 12, shown on a surface of its own by demo.scene.yml.

ui: sign-prefabs
version: 1

# the size of the surface in the scene, so that a unit is a pixel
reference_size: [1024, 512]

root:
  type: panel
  box_sizing: border-box
  width: 100%
  height: 100%
  padding: 44
  gap: 14
  flex_direction: column
  background_color: "#12161c"
  border: "8px solid #9aa7ff"
  children:
    - type: label
      text: "12"
      font_size: 40
      font_weight: bold
      letter_spacing: 6
      color: "#9aa7ff"
    - type: label
      text: "Prefabs and scenes"
      font_size: 92
      font_weight: bold
    - type: label
      text: "One prefab, placed five times, each with what"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "differs written on top. Walk through the arch"
      font_size: 36
      color: "#ffffffc8"
    - type: label
      text: "and a SceneExit loads the museum anew."
      font_size: 36
      color: "#ffffffc8"
