# A user interface with a mistake in it, for the test that a mistake never
# ends the game: the second element is of a kind that does not exist. The
# file is said to be wrong in the log, nothing of it is shown, and the run
# goes on.
#
#   NeonRuntime --ui assets://ui/broken.ui.yml

ui: broken
version: 1

reference_size: [1920, 1080]

root:
  type: panel
  width: 100%
  height: 100%
  children:
    - type: label
      text: This is fine
    - type: lever
      text: This is not
