# What the physics does, in one scene. Start it with
#
#   NeonRuntime --scene assets://scenes/physics.scene.yml
#
# From left to right: balls that fall onto a boulder whose collider is its mesh,
# a ball that rolls down a ramp, crates that fall and stack, a block whose
# collider is its convex hull, and a lift that carries a crate. In front of
# them a character walks through a gate, which is a trigger, into a wall, and
# slides along it.
#
# The components and what they hold are listed in docs/scenes.md, and how the
# physics works in docs/physics.md.

scene: physics
version: 1

entities:
  # does not move: static bodies

  - name: floor
    components:
      Transform:
        position: [0, -0.1, 0]
        scale: [40, 0.2, 40]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [0.5, 0.5, 0.5]
      RigidBody:
        kind: static
      Collider:
        shape: box

  # a collider of triangles: those of the shape as they are
  - name: boulder
    components:
      Transform:
        position: [-9, 1.5, 0]
        scale: 3
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [1, 0.5, 0.31]
      RigidBody:
        kind: static
      Collider:
        shape: mesh

  - name: ramp
    components:
      Transform:
        position: [-4.5, 1, 0]
        rotation: [0, 0, -20]
        scale: [4, 0.2, 2]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.6, 0.4, 0.2]
      RigidBody:
        kind: static
      Collider:
        shape: box

  - name: wall
    components:
      Transform:
        position: [3, 1, 5]
        scale: [0.4, 2, 5]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.7, 0.3, 0.2]
      RigidBody:
        kind: static
      Collider:
        shape: box

  # collide and react: dynamic bodies

  - name: balls
    children:
      - name: first
        components:
          Transform:
            position: [-9, 5, 0]
            scale: 0.4
          Geometry:
            shape: sphere
            sides: 12
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.9, 0.7, 0.2]
          RigidBody:
            bounce: 0.3
          Collider:
            shape: sphere
      - name: second
        components:
          Transform:
            position: [-8.6, 6.5, 0.2]
            scale: 0.4
          Geometry:
            shape: sphere
            sides: 12
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.9, 0.7, 0.2]
          RigidBody:
            bounce: 0.3
          Collider:
            shape: sphere
      - name: third
        components:
          Transform:
            position: [-9.4, 8, -0.2]
            scale: 0.4
          Geometry:
            shape: sphere
            sides: 12
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.9, 0.7, 0.2]
          RigidBody:
            bounce: 0.3
          Collider:
            shape: sphere

  - name: roller
    components:
      Transform:
        position: [-5.8, 2.6, 0]
        scale: 0.8
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.9, 0.3, 0.1]
      RigidBody:
        mass: 2
      Collider:
        shape: sphere

  - name: crates
    children:
      - name: lower
        components:
          Transform:
            position: [0, 0.5, 0]
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.7, 0.5, 0.3]
          RigidBody: Default
          Collider:
            shape: box
      - name: middle
        components:
          Transform:
            position: [0.1, 2, 0]
            rotation: [0, 15, 0]
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.7, 0.5, 0.3]
          RigidBody: Default
          Collider:
            shape: box
      - name: upper
        components:
          Transform:
            position: [-0.1, 3.5, 0]
            rotation: [0, 40, 0]
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.7, 0.5, 0.3]
          RigidBody: Default
          Collider:
            shape: box

  # a convex collider: the smallest shape without dents around the shape
  - name: block
    components:
      Transform:
        position: [3, 3, 0]
        rotation: [0, 30, 20]
        scale: 1.5
      Geometry:
        shape: cylinder
        sides: 6
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.5, 0.2, 0.7]
      RigidBody:
        mass: 3
      Collider:
        shape: convex_hull

  - name: passenger
    components:
      Transform:
        position: [6.5, 1, 0]
        scale: 0.8
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.7, 0.5, 0.3]
      RigidBody:
        can_sleep: false
      Collider:
        shape: box

  # moved by code: a kinematic body, which carries what is on it and is not
  # held back by it
  - name: lift
    components:
      Transform:
        position: [6.5, 0.1, 0]
        scale: [2, 0.2, 2]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.2, 0.2, 0.2]
      RigidBody:
        kind: kinematic
        linear_velocity: [0, 0.4, 0]
      Collider:
        shape: box

  # collide and stop: a character, which slides along what stops it and is
  # not pushed by anything. The capsule is on the entity, which has no scale.
  # What is drawn is below it, sized as it is meant to look.
  - name: walker
    components:
      Transform:
        position: [-6, 1, 4]
      CharacterBody:
        velocity: [2.5, 0, 0.5]
      Collider:
        shape: capsule
        radius: 0.4
        height: 1.8
    children:
      - name: looks
        components:
          Transform:
            scale: [0.8, 1.8, 0.8]
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.2, 0.4, 0.8]

  # overlap only: a trigger, which reports what is inside and stops nothing
  - name: gate
    components:
      Transform:
        position: [-2, 1.3, 4.2]
        scale: [0.2, 2.4, 3]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.5, 0.7, 0.9]
      Trigger: Default
      Collider:
        shape: box

  - name: direction
    components:
      Transform:
        position: [1.2, 1, -2]
      Light:
        type: direction
        direction: [-0.2, -1, -0.3]
        ambient: [0.5, 0.5, 0.5]
        diffuse: [0.4, 0.4, 0.4]
        specular: [0.5, 0.5, 0.5]

  - name: player
    components:
      Transform:
        position: [-1, 5, 17]
        rotation: [-12, 0, 0]
      Spectator: Default
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
