# The demo scene with the settings menu over it:
#
#   NeonRuntime --scene assets://scenes/settings-demo.scene.yml
#
# The menu is a component of an entity, as the HUD of hud-demo is. Escape
# and a controller's cancel close it, as its file says.
#
# The menu sets what is heard. The Effects, Music, and Ambience sliders are
# the volumes of those groups of sounds, through UiVolume, and choosing a
# track fades from one piece of music to another, through UiSoundSwitch.
# The reactor hums by the ball, as ambience. Every track and the reactor are
# the same tone, sounds/tone.wav, written by tools/make-test-game-assets.py:
# what is checked is that they play, switch, and fade, not what is heard.

scene: settings-demo
version: 1

entities:
  - name: settings
    components:
      Ui:
        file: engine://ui/settings.ui.yml

  - name: ball
    components:
      Transform: Default
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [1, 0.5, 0.31]

  - name: floor
    components:
      Transform:
        position: [0, -0.55, 0]
        scale: [100, 0.1, 100]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [0.5, 0.5, 0.5]

  - name: direction
    components:
      Transform:
        position: [1.2, 1, -2]
      Light:
        type: direction
        direction: [-0.2, -1, -0.3]
        ambient: [0.5, 0.5, 0.5]
        diffuse: [0.4, 0.4, 0.4]
        specular: [0.5, 0.5, 0.5]

  - name: player
    components:
      Transform:
        position: [0, 0, 2]
      Spectator: Default
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
          SoundListener: Default

  # the sliders of the menu are the volumes of three groups, from 0 to 100.
  # A project with a group of its own adds an entity like these, with the
  # name of its group, and a row for it in the menu
  - name: effects volume
    components:
      UiVolume:
        value: volume
        group: effects

  - name: music volume
    components:
      UiVolume:
        value: music
        group: music

  - name: ambience volume
    components:
      UiVolume:
        value: ambience
        group: ambience

  # one entity for each piece of music. The one the menu chooses plays, and
  # a new choice fades from it to the next over two seconds
  - name: chilled
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: chilled
        fade: 2

  - name: fight
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: fight
        fade: 2

  - name: hollow
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
      UiSoundSwitch:
        value: track
        equals: hollow
        fade: 2

  # ambience with a place: louder close to the ball, and heard from the
  # side it is on
  - name: reactor
    components:
      Transform: Default
      SoundSource:
        sound: assets://sounds/tone.wav
        looping: true
        spatial: true
        max_distance: 20
        group: ambience
