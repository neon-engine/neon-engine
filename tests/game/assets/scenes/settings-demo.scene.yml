# The demo scene with the settings menu over it:
#
#   NeonRuntime --scene assets://scenes/settings-demo.scene.yml
#
# The menu is a component of an entity, as the HUD of hud-demo is. Escape
# and a controller's cancel close it, as its file says.
#
# A menu of the game chooses the music: the dropdown of ui/music.ui.yml
# calls the jukebox of scripts/jukebox.lua, which fades from one piece to
# the next. The sliders of the settings menu are bound to the volumes of
# the groups by the runtime when the pause menu shows it; shown as a
# component of the scene, as here, they are values and nothing more.
# The reactor hums by the ball, as ambience. Every track and the reactor are
# the same tone, sounds/tone.wav, written by tools/make-test-game-assets.py:
# what is checked is that they play, switch, and fade, not what is heard.

scene: settings-demo
version: 1

entities:
  - name: settings
    components:
      Ui:
        file: engine://ui/settings.ui.yml

  - name: ball
    components:
      Transform: Default
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [1, 0.5, 0.31]

  - name: floor
    components:
      Transform:
        position: [0, -0.55, 0]
        scale: [100, 0.1, 100]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [0.5, 0.5, 0.5]

  - name: direction
    components:
      Transform:
        position: [1.2, 1, -2]
      Light:
        type: direction
        direction: [-0.2, -1, -0.3]
        ambient: [0.5, 0.5, 0.5]
        diffuse: [0.4, 0.4, 0.4]
        specular: [0.5, 0.5, 0.5]

  - name: player
    components:
      Transform:
        position: [0, 0, 2]
      Spectator: Default
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
          SoundListener: Default

  # the music the player chooses, a menu of the game next to the settings:
  # its dropdown calls the jukebox, which fades between the pieces below
  - name: music
    components:
      Ui:
        file: assets://ui/music.ui.yml
      Jukebox:
        fade: 2

  # one entity for each piece of music, silent until the jukebox fades it
  # in. The one the dropdown chooses plays, and a new choice fades from it
  # to the next over two seconds
  - name: chilled
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
        playing: false
      Track:
        name: chilled

  - name: fight
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
        playing: false
      Track:
        name: fight

  - name: hollow
    components:
      SoundSource:
        sound: assets://sounds/tone.wav
        group: music
        looping: true
        playing: false
      Track:
        name: hollow

  # ambience with a place: louder close to the ball, and heard from the
  # side it is on
  - name: reactor
    components:
      Transform: Default
      SoundSource:
        sound: assets://sounds/tone.wav
        looping: true
        spatial: true
        max_distance: 20
        group: ambience
