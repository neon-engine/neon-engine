# The title screen of the prototype game: a column of the Prototype Kit under
# the lamp, with the title menu over it. Start it with
#
#   NeonRuntime --scene assets://scenes/title.scene.yml
#
# The menu's Start button asks for prototype.scene.yml, see
# docs/scenes.md#changing-the-scene. Nothing here is Persistent, so all of
# it goes when the level is read.

scene: title
version: 1

entities:
  - name: menu
    components:
      Ui:
        file: assets://ui/title.ui.yml

  - name: column
    components:
      Transform:
        position: [1.4, -0.8, -0.5]
        rotation: [0, 30, 0]
      Renderable:
        model: assets://models/kit/column.glb
        shader: assets://shaders/basic-lit

  - name: floor
    components:
      Transform:
        position: [-3, -0.8, -3]
        scale: [6, 1, 6]
      Renderable:
        model: assets://models/kit/floor-square.glb
        shader: assets://shaders/basic-lit

  - name: daylight
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.3, -1, -0.2]
        ambient: [0.35, 0.35, 0.4]
        diffuse: [0.5, 0.5, 0.45]
        specular: [0.2, 0.2, 0.2]

  - name: lamp
    components:
      Transform:
        position: [0, 1.6, 1]
      Light:
        type: point
        ambient: [0.05, 0.04, 0.02]
        diffuse: [0.8, 0.6, 0.3]
        specular: [0.3, 0.3, 0.3]
        constant: 1
        linear: 0.14
        quadratic: 0.07

  - name: viewpoint
    components:
      Transform:
        position: [0, 0.4, 3]
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
