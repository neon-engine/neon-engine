# What a joint does, in one scene. Start it with
#
#   NeonRuntime --scene assets://scenes/joints.scene.yml
#
# From left to right: a door on a hinge in a frame, which a ball rolls into
# and swings open as far as its limits let it, and a spring pulls shut again.
# A pendulum that hangs from a hook on a point joint. A sled on a slider
# along a rail, kicked off to one end and stopped at its limit. Two crates
# glued together with a fixed joint, which fall off a ledge as one.
#
# A Joint names the entity it is joined to by its path, or nothing for the
# world itself. Its anchor and axis are on its entity. What the components
# hold is listed in docs/scenes.md, and how the physics works in
# docs/physics.md.

scene: joints
version: 1

entities:
  - name: floor
    components:
      Transform:
        position: [0, -0.1, 0]
        scale: [40, 0.2, 40]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          shininess: 32
          color: [0.5, 0.5, 0.5]
      RigidBody:
        kind: static
      Collider:
        shape: box

  # a door on a hinge: the frame does not move, and the door turns around
  # its left edge, up to 100 degrees either way. The hinge sits at the
  # frame, which a hinge keeps the door from colliding with, and a spring
  # pulls the door shut once the ball has swung it open. The door hangs a
  # little above the floor, as a door does, so that it swings freely
  - name: house
    children:
      - name: frame
        components:
          Transform:
            position: [-7, 1.1, 0]
            scale: [0.2, 2.2, 0.2]
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.2, 0.2, 0.2]
          RigidBody:
            kind: static
          Collider:
            shape: box

  - name: door
    components:
      Transform:
        position: [-6.1, 1.12, 0]
        scale: [1.6, 2.2, 0.1]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.6, 0.4, 0.2]
      RigidBody:
        mass: 5
      Collider:
        shape: box
      Joint:
        type: hinge
        other: house/frame
        anchor: [-0.5, 0, 0]
        axis: [0, 1, 0]
        limits: [-100, 100]
        spring:
          stiffness: 20
          damping: 4

  - name: ball
    components:
      Transform:
        position: [-5.8, 0.4, 5]
        scale: 0.8
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.9, 0.3, 0.1]
      RigidBody:
        mass: 10
        linear_velocity: [0, 0, -7]
      Collider:
        shape: sphere

  # a pendulum: the bob hangs from the hook on a point, and swings
  - name: hook
    components:
      Transform:
        position: [-1, 5, 0]
        scale: 0.3
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.2, 0.2, 0.2]
      RigidBody:
        kind: static
      Collider:
        shape: box

  - name: bob
    components:
      Transform:
        position: [1, 3, 0]
        scale: 0.6
      Geometry:
        shape: sphere
        sides: 12
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.9, 0.7, 0.2]
      RigidBody:
        mass: 2
      Collider:
        shape: sphere
      Joint:
        type: point
        anchor: [-3.3333, 3.3333, 0]

  # a sled on a slider: it moves along the rail and nothing else, and stops
  # at the end of it. The rail is only drawn
  - name: rail
    components:
      Transform:
        position: [4, 0.25, 0]
        scale: [6, 0.1, 0.4]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.2, 0.2, 0.2]

  - name: sled
    components:
      Transform:
        position: [4, 0.65, 0]
        scale: [0.8, 0.6, 0.8]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.7, 0.5, 0.3]
      RigidBody:
        mass: 1
        gravity_scale: 0
        linear_velocity: [3, 0, 0]
      Collider:
        shape: box
      Joint:
        type: slider
        axis: [1, 0, 0]
        limits: [-2.6, 2.6]

  # two crates glued together: the right one is fixed to the left, and the
  # pair falls off the ledge as one
  - name: ledge
    components:
      Transform:
        position: [8.5, 0.5, 0]
        scale: [1.2, 1, 1.2]
      Geometry:
        shape: box
      Renderable:
        shader: engine://shaders/basic-lit
        material:
          color: [0.7, 0.3, 0.2]
      RigidBody:
        kind: static
      Collider:
        shape: box

  - name: glued
    children:
      - name: left
        components:
          Transform:
            position: [8.7, 1.5, 0]
            scale: 0.8
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.7, 0.5, 0.3]
          RigidBody: Default
          Collider:
            shape: box
      - name: right
        components:
          Transform:
            position: [9.5, 1.5, 0]
            scale: 0.8
          Geometry:
            shape: box
          Renderable:
            shader: engine://shaders/basic-lit
            material:
              color: [0.7, 0.5, 0.3]
          RigidBody: Default
          Collider:
            shape: box
          Joint:
            type: fixed
            other: glued/left
            anchor: [-0.5, 0, 0]

  - name: direction
    components:
      Transform:
        position: [1.2, 1, -2]
      Light:
        type: direction
        direction: [-0.2, -1, -0.3]
        ambient: [0.5, 0.5, 0.5]
        diffuse: [0.4, 0.4, 0.4]
        specular: [0.5, 0.5, 0.5]

  - name: player
    components:
      Transform:
        position: [1, 4, 16]
        rotation: [-10, 0, 0]
      Spectator: Default
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
