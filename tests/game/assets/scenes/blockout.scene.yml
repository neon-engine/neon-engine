# A level blocked out from shapes the engine builds, with no model file:
#
#   NeonRuntime --scene assets://scenes/blockout.scene.yml
#
# Every piece is a Geometry in meters, drawn by its Renderable with the pbr
# shader and a texture that repeats once a meter, and collided with through a
# Collider of kind mesh that takes the same shape, but for the crate and the
# platform, which are boxes with a box for a collider. The platform is not a
# plane: a plane has no thickness, so its edge is nothing the player can be
# stopped by, and it is not a mesh: the edge of a mesh at the height of the
# player's round end is ridden up, where the edge of a box is a wall. It is what a tool that
# blocks out levels writes, and what an importer of a map format would fill.

scene: blockout
version: 1

entities:
  - name: light
    components:
      Transform: Default
      Light:
        type: direction
        direction: [-0.4, -1, -0.3]
        ambient: [0.25, 0.25, 0.28]
        diffuse: [0.9, 0.9, 0.85]

  # a room 8 meters square and 3 high, seen from within: a prism with its
  # faces pointing inward, floor and ceiling included
  - name: room
    components:
      Transform:
        position: [0, 0, 0]
      Geometry:
        shape: prism
        size: [0, 3, 0]
        outline: [-4, -4, 4, -4, 4, 4, -4, 4]
        inside: true
      Renderable:
        shader: engine://shaders/pbr
        textures: [assets://textures/brick.png]
        material:
          roughness: 0.8
      RigidBody:
        kind: static
      Collider:
        shape: mesh

  # a raised platform: a box, with a box for its collider, so that its edge
  # is a wall to the player. A plane has a top and no thickness, and the
  # edge of a mesh at the height of the player's round end is ridden up
  - name: platform
    components:
      Transform:
        position: [2, 0.2, 2]
      Geometry:
        shape: box
        size: [3, 0.4, 3]
      Renderable:
        shader: engine://shaders/pbr
        textures: [assets://textures/concrete.png]
        material:
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [3, 0.4, 3]

  # a ledge of 0.2 along the north wall, west of the crate: a box the
  # character walks up without a jump, since it is below its step_height
  - name: step
    components:
      Transform:
        position: [-2, 0.1, -3.5]
      Geometry:
        shape: box
        size: [3, 0.2, 1]
      Renderable:
        shader: engine://shaders/pbr
        textures: [assets://textures/concrete.png]
        material:
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [3, 0.2, 1]

  - name: crate
    components:
      Transform:
        position: [1.5, 0.5, -1.5]
      Geometry:
        shape: box
        size: [1, 1, 1]
        texels_per_meter: 1
      Renderable:
        shader: engine://shaders/pbr
        textures: [assets://textures/wood.png]
        material:
          roughness: 0.6
      RigidBody:
        kind: static
      Collider:
        shape: box
        size: [1, 1, 1]

  - name: ramp
    components:
      Transform:
        position: [-1.5, 0, 1]
      Geometry:
        shape: ramp
        size: [2, 1, 4]
      Renderable:
        shader: engine://shaders/pbr
        textures: [assets://textures/concrete.png]
        material:
          color: [0.8, 0.8, 0.9]
          roughness: 0.9
      RigidBody:
        kind: static
      Collider:
        shape: convex_hull

  # the player walks the room: up the ramp, onto the platform, up the step,
  # and against the crate. A capsule of 1.8 that the physics stands on the
  # floor
  - name: player
    components:
      Transform:
        position: [0, 0.9, 3]
      Player: Default
      CharacterBody: Default
      Collider:
        shape: capsule
        radius: 0.4
        height: 1.8
    children:
      - name: camera
        components:
          Transform: Default
          Camera: Default
