# A wall of the kit of the tests: 1 wide and 1 high along z and 0.2 thick
# along x, standing on its origin. The scene that places it gives it its
# place and its size with a Transform; the collider is in the piece's own
# metres and is sized with it. The Transform is carried from the start so
# that a wall spawned in play stands where its parent is.
version: 1
prefab: wall

entity:
  components:
    Transform: Default
    Renderable:
      model: assets://models/kit/wall.glb
      shader: engine://shaders/basic-lit
    RigidBody:
      kind: static
    Collider:
      shape: box
      size: [0.2, 1, 1]
      offset: [0, 0.5, 0]
